title: PrettyPDF
author: Patrik Sällström
version: 0.0.2
contributes:
  project:
    project:
      type: book
  formats: 
    pdf:
      include-in-header: 
       - "PrettyPDF.tex"
      toc: false
      csl: apa7_sv.csl
      lang: sv
    revealjs:
      scrollable: true
      slide-level: 3
      html-math-method: mathjax
      theme: slides.scss
      lightbox: true
      slide-number: true
      transition: slide
      menu: true
      width: 1600
      height: 900
      logo: "logo.png"
      lang: sv
  filters:
    - highlight-text.lua
